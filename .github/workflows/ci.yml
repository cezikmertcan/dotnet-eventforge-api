name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EventForge.slnx

      - name: Build
        run: dotnet build EventForge.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test EventForge.slnx --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Build Docker image
        run: docker build --tag eventforge-api:ci .
